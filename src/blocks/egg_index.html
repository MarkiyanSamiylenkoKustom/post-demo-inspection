<!-- ▼ Easter egg: Matterport Inspector · disco ball + Happy Inspector button when the form is complete -->
<style>
#ieggStage{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#ieggStage.play{background:linear-gradient(rgba(13,15,30,0) 0%,rgba(13,15,30,.35) 45%,rgba(13,15,30,.72) 100%)}
#ieggBall{position:absolute;top:-4px;right:16px;width:38px;pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;transition:transform .9s cubic-bezier(.34,1.4,.64,1)}
#ieggBall .cord{display:block;width:2px;height:10px;background:#6E7BA8;margin:0 auto;transition:height .9s cubic-bezier(.34,1.4,.64,1)}
#ieggBall .orb{display:block;position:relative;width:38px;height:38px}
#ieggBall .orb svg{position:absolute;left:0;top:0;width:38px;height:38px}
#ieggBall .f1,#ieggBall .f2{opacity:0}
#ieggStage.play #ieggBall{transform:translateY(46px)}
#ieggStage.play #ieggBall .cord{height:56px}
#ieggStage.play #ieggBall .f0{animation:ieggSpin0 .45s steps(1) infinite}
#ieggStage.play #ieggBall .f1{animation:ieggSpin1 .45s steps(1) infinite}
#ieggStage.play #ieggBall .f2{animation:ieggSpin2 .45s steps(1) infinite}
@keyframes ieggSpin0{0%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes ieggSpin1{0%,32%{opacity:0}33%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes ieggSpin2{0%,65%{opacity:0}66%,100%{opacity:1}}
#ieggSky{position:fixed;inset:0;pointer-events:none;z-index:120;display:none}
.ieggSpark{position:absolute;opacity:0;text-shadow:0 0 8px currentColor;animation:ieggTw 1.1s ease-in-out infinite}
@keyframes ieggTw{0%,100%{opacity:0;transform:scale(.5) rotate(0deg)}50%{opacity:1;transform:scale(1.25) rotate(20deg)}}
#ieggMan{position:absolute;bottom:12px;left:10%;height:112px;width:auto;opacity:0;transform:translateY(16px);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
#ieggMan.in{opacity:1;transform:translateY(0);transition:opacity .35s,transform .35s;animation:ieggNod .8s ease-in-out .35s infinite}
@keyframes ieggNod{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#ieggMan.board{animation:none;transition:transform .6s ease-in,opacity .6s;opacity:0 !important}
#ieggBubble{position:absolute;bottom:120px;left:calc(10% + 46px);max-width:250px;opacity:0;transform:scale(.6);transform-origin:bottom left;
  background:#F5F2EA;color:#1A1A1A;border:3px solid #1A1A1A;border-radius:4px;padding:10px 12px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;font-weight:700;line-height:1.45;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
#ieggBubble::after{content:"";position:absolute;left:14px;bottom:-12px;width:0;height:0;border:6px solid transparent;border-top-color:#1A1A1A}
#ieggBubble .rr{color:#C8102E}
#ieggBubble.in{opacity:1;transform:scale(1);transition:opacity .25s,transform .25s cubic-bezier(.34,1.6,.64,1)}
#ieggBubble.out{opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s}
#ieggBus{position:absolute;bottom:8px;left:0;width:190px;transform:translateX(-220px);filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
#ieggBus.drive{transition:transform 1.2s cubic-bezier(.22,.9,.35,1)}
#ieggBus.exit{transition:transform 1.1s cubic-bezier(.6,.05,.9,.4)}
#ieggStage .ieggRoad{position:absolute;bottom:6px;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,#6B7280 0 14px,transparent 14px 26px);opacity:0;transition:opacity .4s}
#ieggStage.play .ieggRoad{opacity:.8}
#happyInsBtn{display:none}
#happyInsBtn.show{display:inline-block}
#happyInsOverlay{position:fixed;inset:0;pointer-events:none;z-index:130;display:none;align-items:flex-end;justify-content:center}
#happyInsOverlay.show{display:flex}
#happyInsOverlay img{height:170px;width:auto;margin-bottom:12vh;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));animation:ihappyPop 2.6s ease-in-out forwards}
@keyframes ihappyPop{0%{opacity:0;transform:translateY(30px) scale(.7)}12%{opacity:1;transform:translateY(0) scale(1.05)}20%{transform:scale(1)}45%{transform:translateY(-6px)}60%{transform:translateY(0)}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@media print{#ieggStage,#ieggSky,#happyInsOverlay,#happyInsBtn{display:none !important}}
@media (prefers-reduced-motion:reduce){#ieggStage *,#ieggSky *,#happyInsOverlay *{animation:none !important;transition:none !important}}
</style>

(function(){

      man=document.getElementById("ieggMan"), bub=document.getElementById("ieggBubble"),
      busy=false, AC=null;
  function at(ms,fn){ setTimeout(fn,ms); }
  function skyOn(){
    var colors=["#E8ECFD","#8A9BF0","#F9A8D4","#FDE047","#FFFFFF","#86EFAC"];
    sky.innerHTML="";
    for(var i=0;i<24;i++){
      var s=document.createElement("span");
      s.className="ieggSpark"; s.textContent="\u2726";
      s.style.left=(Math.random()*96+2)+"%"; s.style.top=(Math.random()*92+2)+"%";
      s.style.color=colors[i%colors.length];
      s.style.fontSize=(9+Math.random()*11)+"px";
      s.style.animationDelay=(Math.random()*1.1)+"s";
      sky.appendChild(s);
    }
    sky.style.display="block";
  }
  function skyOff(){ sky.style.display="none"; sky.innerHTML=""; }
  function disco(dur){
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==="suspended") AC.resume();
      var t0=AC.currentTime+0.06, b=60/126, end=t0+dur, t, i;
      var m=AC.createGain(); m.gain.setValueAtTime(0.15,t0);
      m.gain.setValueAtTime(0.15,end-0.5); m.gain.linearRampToValueAtTime(0.0001,end);
      m.connect(AC.destination);
      for(t=t0;t<end;t+=b){
        var o=AC.createOscillator(),g=AC.createGain();
        o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(46,t+0.12);
        g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
        o.connect(g); g.connect(m); o.start(t); o.stop(t+0.16);
      }
      var nb=AC.createBuffer(1,AC.sampleRate*0.05|0,AC.sampleRate), dch=nb.getChannelData(0);
      for(i=0;i<dch.length;i++) dch[i]=Math.random()*2-1;
      for(t=t0+b/2;t<end;t+=b){
        var sN=AC.createBufferSource(),gN=AC.createGain(),fN=AC.createBiquadFilter();
        sN.buffer=nb; fN.type="highpass"; fN.frequency.value=6500;
        gN.gain.setValueAtTime(0.26,t); gN.gain.exponentialRampToValueAtTime(0.001,t+0.05);
        sN.connect(fN); fN.connect(gN); gN.connect(m); sN.start(t);
      }
      var bass=[110,110,220,110,98,98,196,98,87.31,87.31,174.61,87.31,98,98,196,98]; i=0;
      for(t=t0;t<end;t+=b/2){
        var oB=AC.createOscillator(),gB=AC.createGain();
        oB.type="square"; oB.frequency.value=bass[i++%bass.length];
        gB.gain.setValueAtTime(0.13,t); gB.gain.linearRampToValueAtTime(0.001,t+b/2*0.9);
        oB.connect(gB); gB.connect(m); oB.start(t); oB.stop(t+b/2);
      }
    }catch(e){}
  }
  ball.addEventListener("click",function(){
    if(busy) return; busy=true;
    stage.classList.add("play");
    skyOn(); disco(6.4);
    at(900,function(){ man.classList.add("in"); });
    at(1400,function(){ bub.classList.add("in"); });
    at(3800,function(){ bub.classList.remove("in"); bub.classList.add("out"); });
    at(3900,function(){
      bus.classList.add("drive");
      var stop=Math.max(4, stage.offsetWidth*0.42-100);

    });
    at(5100,function(){
      var bx=bus.getBoundingClientRect(), rr=man.getBoundingClientRect();
      man.classList.add("board");
      man.style.transform="translate("+(bx.left+bx.width*0.5-rr.left)+"px,6px)";
    });
    at(5800,function(){
      bus.classList.remove("drive"); bus.classList.add("exit");
      bus.style.transform="translateX("+(stage.offsetWidth+80)+"px)";
    });
    at(6800,function(){ stage.classList.remove("play"); skyOff(); });
    at(7800,function(){
      bus.classList.remove("exit"); bus.style.transform="";
      man.classList.remove("in","board"); man.style.transform="";
      bub.classList.remove("in","out");
      busy=false;
    });
  });
