<!-- ▼ Easter egg: Rocio · disco ball in the masthead + Happy Rocio button when the form is complete -->
<style>
#reggStage{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#reggStage.play{background:linear-gradient(rgba(13,15,30,0) 0%,rgba(13,15,30,.35) 45%,rgba(13,15,30,.72) 100%)}
#reggBall{position:absolute;top:-4px;right:16px;width:38px;pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;transition:transform .9s cubic-bezier(.34,1.4,.64,1)}
#reggBall .cord{display:block;width:2px;height:10px;background:#6E7BA8;margin:0 auto;transition:height .9s cubic-bezier(.34,1.4,.64,1)}
#reggBall .orb{display:block;position:relative;width:38px;height:38px}
#reggBall .orb svg{position:absolute;left:0;top:0;width:38px;height:38px}
#reggBall .f1,#reggBall .f2{opacity:0}
#reggStage.play #reggBall{transform:translateY(46px)}
#reggStage.play #reggBall .cord{height:56px}
#reggStage.play #reggBall .f0{animation:reggSpin0 .45s steps(1) infinite}
#reggStage.play #reggBall .f1{animation:reggSpin1 .45s steps(1) infinite}
#reggStage.play #reggBall .f2{animation:reggSpin2 .45s steps(1) infinite}
@keyframes reggSpin0{0%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes reggSpin1{0%,32%{opacity:0}33%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes reggSpin2{0%,65%{opacity:0}66%,100%{opacity:1}}
#reggSky{position:fixed;inset:0;pointer-events:none;z-index:120;display:none}
.reggSpark{position:absolute;opacity:0;text-shadow:0 0 8px currentColor;animation:reggTw 1.1s ease-in-out infinite}
@keyframes reggTw{0%,100%{opacity:0;transform:scale(.5) rotate(0deg)}50%{opacity:1;transform:scale(1.25) rotate(20deg)}}
#reggRocio{position:absolute;bottom:12px;left:12%;height:110px;width:auto;opacity:0;transform:translateY(16px);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
#reggRocio.in{opacity:1;transform:translateY(0);transition:opacity .35s,transform .35s;animation:reggStomp .6s ease-in-out .35s infinite}
@keyframes reggStomp{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(-2deg)}}
#reggRocio.board{animation:none;transition:transform .6s ease-in,opacity .6s;opacity:0 !important}
#reggBubble{position:absolute;bottom:118px;left:calc(12% + 70px);height:88px;width:auto;opacity:0;transform:scale(.6);transform-origin:bottom left;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
#reggBubble.in{opacity:1;transform:scale(1);transition:opacity .25s,transform .25s cubic-bezier(.34,1.6,.64,1)}
#reggBubble.out{opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s}
#reggBus{position:absolute;bottom:8px;left:0;width:190px;transform:translateX(-220px);filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
#reggBus.drive{transition:transform 1.2s cubic-bezier(.22,.9,.35,1)}
#reggBus.exit{transition:transform 1.1s cubic-bezier(.6,.05,.9,.4)}
#reggStage .reggRoad{position:absolute;bottom:6px;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,#6B7280 0 14px,transparent 14px 26px);opacity:0;transition:opacity .4s}
#reggStage.play .reggRoad{opacity:.8}
#happyBtn{display:none}
#happyBtn.show{display:inline-block}
#happyOverlay{position:fixed;inset:0;pointer-events:none;z-index:130;display:none;align-items:flex-end;justify-content:center}
#happyOverlay.show{display:flex}
#happyOverlay img{height:170px;width:auto;margin-bottom:12vh;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));animation:happyPop 2.6s ease-in-out forwards}
@keyframes happyPop{0%{opacity:0;transform:translateY(30px) scale(.7)}12%{opacity:1;transform:translateY(0) scale(1.05)}20%{transform:scale(1)}45%{transform:translateY(-6px)}60%{transform:translateY(0)}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@media print{#reggStage,#reggSky,#happyOverlay,#happyBtn{display:none !important}}
@media (prefers-reduced-motion:reduce){#reggStage *,#reggSky *,#happyOverlay *{animation:none !important;transition:none !important}}
</style>

      ro=document.getElementById("reggRocio"), bub=document.getElementById("reggBubble"),
      busy=false, AC=null;
  function at(ms,fn){ setTimeout(fn,ms); }
  function skyOn(){
    var colors=["#E8ECFD","#8A9BF0","#F9A8D4","#FDE047","#FFFFFF","#86EFAC"];
    sky.innerHTML="";
    for(var i=0;i<24;i++){
      var s=document.createElement("span");
      s.className="reggSpark"; s.textContent="\u2726";
      s.style.left=(Math.random()*96+2)+"%"; s.style.top=(Math.random()*92+2)+"%";
      s.style.color=colors[i%colors.length];
      s.style.fontSize=(9+Math.random()*11)+"px";
      s.style.animationDelay=(Math.random()*1.1)+"s";
      sky.appendChild(s);
    }
    sky.style.display="block";
  }
  function skyOff(){ sky.style.display="none"; sky.innerHTML=""; }
  function disco(dur){
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==="suspended") AC.resume();
      var t0=AC.currentTime+0.06, b=60/126, end=t0+dur, t, i;
      var m=AC.createGain(); m.gain.setValueAtTime(0.15,t0);
      m.gain.setValueAtTime(0.15,end-0.5); m.gain.linearRampToValueAtTime(0.0001,end);
      m.connect(AC.destination);
      for(t=t0;t<end;t+=b){
        var o=AC.createOscillator(),g=AC.createGain();
        o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(46,t+0.12);
        g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
        o.connect(g); g.connect(m); o.start(t); o.stop(t+0.16);
      }
      var nb=AC.createBuffer(1,AC.sampleRate*0.05|0,AC.sampleRate), dch=nb.getChannelData(0);
      for(i=0;i<dch.length;i++) dch[i]=Math.random()*2-1;
      for(t=t0+b/2;t<end;t+=b){
        var sN=AC.createBufferSource(),gN=AC.createGain(),fN=AC.createBiquadFilter();
        sN.buffer=nb; fN.type="highpass"; fN.frequency.value=6500;
        gN.gain.setValueAtTime(0.26,t); gN.gain.exponentialRampToValueAtTime(0.001,t+0.05);
        sN.connect(fN); fN.connect(gN); gN.connect(m); sN.start(t);
      }
      var bass=[110,110,220,110,98,98,196,98,87.31,87.31,174.61,87.31,98,98,196,98]; i=0;
      for(t=t0;t<end;t+=b/2){
        var oB=AC.createOscillator(),gB=AC.createGain();
        oB.type="square"; oB.frequency.value=bass[i++%bass.length];
        gB.gain.setValueAtTime(0.13,t); gB.gain.linearRampToValueAtTime(0.001,t+b/2*0.9);
        oB.connect(gB); gB.connect(m); oB.start(t); oB.stop(t+b/2);
      }
    }catch(e){}
  }
  ball.addEventListener("click",function(){
    if(busy) return; busy=true;
    stage.classList.add("play");
    skyOn(); disco(6.4);
    at(900,function(){ ro.classList.add("in"); });
    at(1400,function(){ bub.classList.add("in"); });
    at(3600,function(){ bub.classList.remove("in"); bub.classList.add("out"); });
    at(3700,function(){
      bus.classList.add("drive");
      var stop=Math.max(4, stage.offsetWidth*0.42-100);
      bus.style.transform="translateX("+stop+"px)";
    });
    at(4900,function(){
      var bx=bus.getBoundingClientRect(), rr=ro.getBoundingClientRect();
      ro.classList.add("board");
      ro.style.transform="translate("+(bx.left+bx.width*0.5-rr.left)+"px,6px)";
    });
    at(5600,function(){
      bus.classList.remove("drive"); bus.classList.add("exit");
      bus.style.transform="translateX("+(stage.offsetWidth+80)+"px)";
    });
    at(6600,function(){ stage.classList.remove("play"); skyOff(); });
    at(7600,function(){
      bus.classList.remove("exit"); bus.style.transform="";
      ro.classList.remove("in","board"); ro.style.transform="";
      bub.classList.remove("in","out");
      busy=false;
    });
  });
