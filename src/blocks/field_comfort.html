<!-- ▼ Field comfort: Now buttons, Job ID auto-format, scroll to missing -->
<style>
.nowBtn{font-family:inherit;font-size:.72rem;font-weight:700;color:var(--blue);background:var(--blue-soft);border:1px dashed var(--blue);border-radius:999px;padding:6px 12px;margin-left:8px;cursor:pointer;vertical-align:middle}
@media print{.nowBtn{display:none !important}}
</style>
<script>
(function(){
  "use strict";
  /* 1) One-tap "Now" next to every time field */
  document.querySelectorAll('input[type="time"]').forEach(function(inp){
    var b=document.createElement("button");
    b.type="button"; b.className="nowBtn"; b.textContent="Now";
    b.addEventListener("click",function(){
      var d=new Date();
      inp.value=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
      inp.dispatchEvent(new Event("input",{bubbles:true}));
      inp.dispatchEvent(new Event("change",{bubbles:true}));
    });
    var wr=document.createElement("span");
    wr.appendChild(b);
    inp.insertAdjacentElement("afterend", wr);
  });
  /* 2) Job ID auto-format: 250433091 -> 25-04-33091 (only while adding digits) */
  var job=document.getElementById("job");
  if(job){
    job.addEventListener("input",function(){
      var raw=job.value;
      if(!/^[\d-]*$/.test(raw)) return;                     /* leave non-numeric formats alone */
      var digits=raw.replace(/-/g,"");
      if(digits.length>9) return;
      var prev=job.dataset.prevLen|0;
      job.dataset.prevLen=raw.length;
      if(raw.length<prev) return;                            /* do not fight deletions */
      var out=digits;
      if(digits.length>4) out=digits.slice(0,2)+"-"+digits.slice(2,4)+"-"+digits.slice(4);
      else if(digits.length>2) out=digits.slice(0,2)+"-"+digits.slice(2);
      if(out!==raw){
        job.value=out;
        job.dataset.prevLen=out.length;
        job.dispatchEvent(new Event("input",{bubbles:true}));
      }
    });
  }
  /* 3) After a blocked Send, scroll to the first highlighted field */
  var send=document.getElementById("sendBtn");
  if(send){
    send.addEventListener("click",function(){
      setTimeout(function(){
        var bad=document.querySelector(".invalid");
        if(bad && typeof bad.scrollIntoView === "function"){
          try{ bad.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ try{ bad.scrollIntoView(); }catch(e2){} }
        }
      }, 180);
    });
  }
  /* 3b) "+" buttons that add another line to a multi-link field (data-addline="<textarea id>") */
  document.addEventListener("click", function(ev){
    var t=ev.target, b=null;
    while(t && t!==document){ if(t.getAttribute && t.getAttribute("data-addline")){ b=t; break; } t=t.parentNode; }
    if(!b) return;
    var ta=document.getElementById(b.getAttribute("data-addline"));
    if(!ta) return;
    if(ta.value.trim() && ta.value.slice(-1)!=="\n") ta.value += "\n";
    ta.focus();
    try{ ta.selectionStart = ta.selectionEnd = ta.value.length; }catch(e){}
    ta.dispatchEvent(new Event("input",{bubbles:true}));
  });
  /* 4) iOS: fixed bottom elements detach while the keyboard is open - hide them, restore with a repaint nudge */
  (function(){
    var vv=window.visualViewport;
    if(!vv) return;
    function els(){
      return [document.querySelector(".mobile-bar"), document.getElementById("toTopBtn"), document.getElementById("nsMeter")]
        .filter(function(e){ return !!e; });
    }
    var hidden=false;
    function upd(){
      var kb=(window.innerHeight - vv.height) > 140;
      if(kb && !hidden){
        hidden=true;
        els().forEach(function(e){ e.setAttribute("data-kb","1"); e.style.visibility="hidden"; });
      } else if(!kb && hidden){
        hidden=false;
        els().forEach(function(e){
          if(e.getAttribute("data-kb")){
            e.removeAttribute("data-kb");
            e.style.visibility="";
            e.style.transform="translateZ(0)";
            requestAnimationFrame(function(){ e.style.transform=""; });
          }
        });
        try{ window.scrollBy(0,1); window.scrollBy(0,-1); }catch(err){}
      }
    }
    vv.addEventListener("resize", upd);
    vv.addEventListener("scroll", upd);
  })();
  /* 5) iOS: fixed elements can strand mid-page after scroll / URL-bar collapse - re-pin them when scrolling stops */
  (function(){
    var t=null;
    function pin(){
      [document.querySelector(".mobile-bar"), document.getElementById("toTopBtn"), document.getElementById("nsMeter")]
        .forEach(function(e){
          if(!e || e.getAttribute("data-kb")) return;
          e.style.transform="translateZ(0)";
          requestAnimationFrame(function(){ e.style.transform=""; });
        });
    }
    function onScroll(){ clearTimeout(t); t=setTimeout(pin, 220); }
    window.addEventListener("scroll", onScroll, {passive:true});
    window.addEventListener("touchend", onScroll, {passive:true});
    window.addEventListener("orientationchange", function(){ setTimeout(pin, 350); });
  })();
})();
</script>
<!-- ▲ Field comfort -->
