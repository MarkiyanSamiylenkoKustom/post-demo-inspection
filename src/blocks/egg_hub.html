<!-- ▼ Easter egg: disco ball · tap the ball in the top-right corner of the masthead -->
<style>
#eggStage{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#eggStage.play{background:linear-gradient(rgba(13,15,30,0) 0%,rgba(13,15,30,.35) 45%,rgba(13,15,30,.72) 100%)}
#eggBall{position:absolute;top:-4px;right:16px;width:38px;pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;transition:transform .9s cubic-bezier(.34,1.4,.64,1)}
#eggBall .cord{display:block;width:2px;height:10px;background:#6E7BA8;margin:0 auto;transition:height .9s cubic-bezier(.34,1.4,.64,1)}
#eggBall .orb{display:block;position:relative;width:38px;height:38px}
#eggBall .orb svg{position:absolute;left:0;top:0;width:38px;height:38px}
#eggBall .f1,#eggBall .f2{opacity:0}
#eggStage.play #eggBall{transform:translateY(46px)}
#eggStage.play #eggBall .cord{height:56px}
#eggStage.play #eggBall .f0{animation:eggSpin0 .45s steps(1) infinite}
#eggStage.play #eggBall .f1{animation:eggSpin1 .45s steps(1) infinite}
#eggStage.play #eggBall .f2{animation:eggSpin2 .45s steps(1) infinite}
@keyframes eggSpin0{0%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes eggSpin1{0%,32%{opacity:0}33%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes eggSpin2{0%,65%{opacity:0}66%,100%{opacity:1}}
#eggSky{position:fixed;inset:0;pointer-events:none;z-index:120;display:none}
.eggSpark{position:absolute;opacity:0;text-shadow:0 0 8px currentColor;animation:eggTwinkle 1.1s ease-in-out infinite}
@keyframes eggTwinkle{0%,100%{opacity:0;transform:scale(.5) rotate(0deg)}50%{opacity:1;transform:scale(1.25) rotate(20deg)}}
.eggWorker{position:absolute;bottom:20px;height:58px;width:auto;opacity:0;transform:translateY(10px);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.eggWorker.in{opacity:1;transform:translateY(0);transition:opacity .3s,transform .3s;animation:eggDance .5s ease-in-out .3s infinite}
@keyframes eggDance{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.eggWorker.board{animation:none;transition:transform .55s ease-in,opacity .55s;opacity:0 !important}
#eggBus{position:absolute;bottom:8px;left:0;width:210px;transform:translateX(-240px);filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
#eggBus.drive{transition:transform 1.2s cubic-bezier(.22,.9,.35,1)}
#eggBus.exit{transition:transform 1.1s cubic-bezier(.6,.05,.9,.4)}
#eggStage .eggRoad{position:absolute;bottom:6px;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,#6B7280 0 14px,transparent 14px 26px);opacity:0;transition:opacity .4s}
#eggStage.play .eggRoad{opacity:.8}
@media (max-width:520px){.eggWorker{height:46px}#eggBus{width:170px}}
@media print{#eggStage,#eggSky{display:none !important}}
@media (prefers-reduced-motion:reduce){#eggStage *,#eggSky *{animation:none !important;transition:none !important}}
</style>

<script>

  var ball=document.getElementById("eggBall"), bus=document.getElementById("eggBus"),

    var colors=["#E8ECFD","#8A9BF0","#F9A8D4","#FDE047","#FFFFFF","#86EFAC"];

      s.style.top=(Math.random()*92+2)+"%";
      s.style.color=colors[i%colors.length];
      s.style.fontSize=(9+Math.random()*11)+"px";
      s.style.animationDelay=(Math.random()*1.1)+"s";

    }

  }
